<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mandate Status Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header>
    <div><h1>Mandate Status Tracker</h1><p>Management overview</p></div>
    <div class="buttons">
      <button id="themeBtn">Dark mode</button>
      <button id="archiveBtn">View archive</button>
      <button id="summaryBtn">Generate summary</button>
      <button id="addBtn" class="primary">+ Add task</button>
    </div>
  </header>

  <section class="kpis">
    <div><b id="totalCount">0</b><span>Total</span></div>
    <div><b id="activeCount">0</b><span>Active</span></div>
    <div><b id="attentionCount">0</b><span>Needs attention</span></div>
    <div><b id="completedCount">0</b><span>Completed</span></div>
  </section>

  <section class="toolbar">
    <input id="searchInput" placeholder="Search tasks or updates">
    <select id="statusFilter"><option value="">All statuses</option></select>
    <select id="ownerFilter"><option value="">All owners</option></select>
    <label><input type="checkbox" id="hideCompleted"> Hide completed</label>
    <button id="refreshBtn">Refresh</button>
    <span id="state"></span>
  </section>

  <div id="archiveNotice" class="notice" hidden>Archive view: restore tasks or delete them permanently.</div>

  <section class="table-wrap">
    <table>
      <thead><tr><th>Task</th><th>Owner</th><th>Priority</th><th>Status</th><th>Progress</th><th>Latest update</th><th>Attention</th><th>Actions</th></tr></thead>
      <tbody id="taskBody"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No tasks match the current view.</p>
  </section>
</main>

<dialog id="taskDialog">
  <form id="taskForm">
    <div class="dialog-title"><h2 id="formTitle">Add task</h2><button type="button" id="closeTask">×</button></div>
    <input type="hidden" id="taskId">
    <label>Task name<input id="taskName" required maxlength="150"></label>
    <div class="grid">
      <label>Owner<input id="taskOwner" required maxlength="60"></label>
      <label>Priority<select id="taskPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
      <label>Status<select id="taskStatus"></select></label>
      <label>Progress<select id="taskProgress"></select></label>
    </div>
    <label>Latest update<textarea id="taskUpdate" rows="4"></textarea></label>
    <label>Decision or support required<textarea id="taskSupport" rows="2"></textarea></label>
    <label class="check"><input type="checkbox" id="taskAttention"> Manager attention required</label>
    <div class="footer"><button type="button" id="cancelTask">Cancel</button><button class="primary" type="submit">Save task</button></div>
  </form>
</dialog>

<dialog id="summaryDialog">
  <div class="panel">
    <div class="dialog-title"><h2>Management summary</h2><button type="button" id="closeSummary">×</button></div>
    <p id="summaryNote"></p>
    <textarea id="summaryText" rows="19" readonly></textarea>
    <div class="footer"><button id="copySummary" class="primary">Copy to clipboard</button></div>
  </div>
</dialog>

<dialog id="confirmDialog">
  <div class="panel small">
    <h2 id="confirmTitle">Confirm</h2><p id="confirmText"></p>
    <div class="footer"><button id="confirmCancel">Cancel</button><button id="confirmOk" class="danger">Confirm</button></div>
  </div>
</dialog>
<script src="config.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
